<style>
:root{--bg:#07090a;--card:#13171a;--card2:#1b2024;--tx:#f4f6f5;--mut:#8c9693;--ac:#7be05c;--on:#07210b;--line:rgba(255,255,255,.08);--glass:rgba(14,18,17,.62);--glow:rgba(123,224,92,.22);box-sizing:border-box}
:root[data-theme=light]{--bg:#eef2ee;--card:#fff;--card2:#eef2ee;--tx:#0d1410;--mut:#5d6b63;--ac:#6ad84a;--line:rgba(0,0,0,.09);--glass:rgba(255,255,255,.66);--glow:rgba(106,216,74,.3)}
:root[data-hc="1"]{--mut:var(--tx);--line:rgba(128,128,128,.6)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{background:var(--bg);color:var(--tx);min-height:100%;transition:background .5s,color .5s;overflow-x:hidden}
.glow{position:fixed;width:320px;height:320px;border-radius:50%;background:var(--glow);filter:blur(80px);z-index:0;pointer-events:none;animation:fl 14s ease-in-out infinite alternate}
.g1{top:-100px;left:-80px}.g2{bottom:60px;right:-120px;animation-delay:-6s}
@keyframes fl{to{transform:translate(40px,60px) scale(1.2)}}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5)}
.av{width:46px;height:46px;border-radius:50%;border:2px solid var(--ac);background:var(--card2);color:var(--tx);font-weight:700;overflow:hidden;cursor:pointer;display:grid;place-items:center;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.hi{flex:1;display:flex;flex-direction:column;min-width:0}.hi small{color:var(--mut);font-size:.8rem}.hi b{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.ib:active,.act button:active{transform:scale(.92)}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
svg{width:22px;height:22px;display:block}
main{padding:6px 16px 130px}
.page{display:none}.page.on{display:block}
.page.on>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.page.on>*:nth-child(2){animation-delay:.07s}.page.on>*:nth-child(3){animation-delay:.14s}.page.on>*:nth-child(4){animation-delay:.21s}.page.on>*:nth-child(5){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(6px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:14px;transition:background .5s}
.hero{background:linear-gradient(145deg,#86ea66,#5fd23f);color:#07210b;border-radius:28px;padding:20px;margin-bottom:14px;box-shadow:0 18px 50px -18px var(--glow)}
.hero small{opacity:.7;font-size:.85rem}.big{font-size:2.4rem;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.chip{display:inline-block;font-size:.78rem;font-weight:700;background:rgba(0,0,0,.12);border-radius:20px;padding:4px 10px}
.act{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.act button{background:none;border:0;color:inherit;font-size:.78rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:transform .2s}
.act button span{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.1);display:grid;place-items:center}
h2{font-size:.9rem;color:var(--mut);font-weight:500}
.num{font-size:2rem;font-weight:700;margin:4px 0 14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font-size:.68rem;color:var(--mut)}
.bars i{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(var(--ac),transparent);min-height:4px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:0;background:var(--ac);color:var(--on);font-weight:700;border-radius:16px;padding:13px 18px;cursor:pointer;font-size:.95rem;transition:transform .2s,filter .2s}.btn:active{transform:scale(.96)}
.sm{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);cursor:pointer;font-size:1rem}
input[type=text],input[type=date],input[type=number],textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:13px 14px;font-size:.95rem;outline:none;transition:border-color .2s,box-shadow .2s;color-scheme:inherit}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
textarea{resize:vertical;min-height:80px}
.f{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips button,.seg button,.ltr button{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:10px 14px;border-radius:20px;font-weight:500;white-space:nowrap;cursor:pointer;flex:none;transition:all .25s}
.chips button.on,.seg button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:5px;margin-bottom:14px}.seg button{border:0;background:none;border-radius:20px}
.bc{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:10px;overflow:hidden;transition:border-color .3s}
.bc.on{border-color:var(--ac)}
.bh{padding:15px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.bh b{display:block;font-size:.95rem;margin-top:5px}
.tag{font-size:.72rem;font-weight:700;background:var(--ac);color:var(--on);padding:3px 9px;border-radius:12px}
.ar{transition:transform .35s;color:var(--mut)}.bc.on .ar{transform:rotate(180deg)}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}.bc.on .bd{grid-template-rows:1fr}.bd>div{overflow:hidden}
.in{padding:0 16px 16px}.rt{font-size:.8rem;color:var(--mut);line-height:1.5;background:var(--card2);border-radius:14px;padding:12px;margin-bottom:12px}
.tg{display:flex;flex-wrap:wrap;gap:6px}.tc{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:.82rem}
.tc.nx{background:var(--ac);color:var(--on);font-weight:700}.tc small{display:block;font-size:.58rem}
.ltr{display:flex;justify-content:center;gap:12px;margin-bottom:14px}.ltr button{width:50px;height:50px;border-radius:50%;padding:0;font-size:1.1rem;font-weight:700}.ltr button.on{background:var(--tx);color:var(--bg);transform:scale(1.1)}
.wd,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.wd{font-size:.72rem;color:var(--mut);margin:12px 0 6px}
.dc{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;animation:pop .4s both}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.dc small{font-size:.5rem;font-weight:700;margin-top:2px}
.dia{background:#e6eee7;color:#0d1410;border:1px solid rgba(0,0,0,.1)}.noite{background:#000;color:#fff;border:1px solid #3a423e}.folga{background:var(--card2);color:var(--mut)}
.hj{outline:2px solid var(--ac);outline-offset:2px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;animation:rise .45s both}
.item div{flex:1;min-width:0}.item b{display:block}.item small{color:var(--mut);display:block;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.del{background:none;border:0;color:var(--mut);cursor:pointer;padding:6px}.pn[hidden]{display:none}.empty{text-align:center;color:var(--mut);padding:26px 10px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.set:first-of-type{border-top:0}
.sw{position:relative;width:52px;height:30px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;z-index:2;cursor:pointer}.sw i{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:20px;transition:.3s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.3s}.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{transform:translateX(22px);background:var(--on)}
input[type=range]{accent-color:var(--ac);width:130px}
.big-av{width:96px;height:96px;margin:0 auto 14px;display:block;font-size:1.6rem}
.up{display:block;text-align:center;color:var(--ac);font-weight:700;font-size:.9rem;margin-bottom:16px;cursor:pointer}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;display:flex;gap:6px;padding:7px;border-radius:36px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 14px 40px -10px rgba(0,0,0,.5);max-width:calc(100% - 24px)}
.ni{display:flex;align-items:center;height:52px;min-width:52px;justify-content:center;border:0;border-radius:26px;background:var(--card2);color:var(--mut);cursor:pointer;transition:all .45s cubic-bezier(.2,.8,.2,1);padding:0 14px}
.ni span{max-width:0;overflow:hidden;white-space:nowrap;font-weight:700;font-size:.9rem;transition:max-width .45s,margin .45s}
.ni.on{background:var(--ac);color:var(--on);padding:0 18px 0 14px}.ni.on span{max-width:80px;margin-left:8px}
.hol{position:relative;cursor:pointer}.hol:after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#ff5d6c}
#md{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .3s}#md.on{opacity:1;pointer-events:auto}
.mb{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px;width:100%;max-width:340px;text-align:center;transform:scale(.9) translateY(20px);transition:transform .4s cubic-bezier(.2,.8,.2,1)}#md.on .mb{transform:none}
:root[data-calm="1"] *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="card" onclick="go('nts');seg(1)" style="cursor:pointer"><h2>Última anotação</h2>${nt?`<b style="display:block;margin-top:8px">${esc(nt.t||'Sem título')}</b><small style="color:var(--mut)">${esc(nt.x.slice(0,90))}</small>`:'<div style="margin-top:8px;color:var(--mut)">Nenhuma anotação ainda.</div>'}</div><div class="card" id="rm"></div>`;rRM()}
let cat='DIAS ÚTEIS';
function rCats(){$('#cats').innerHTML=Object.keys(busDatabase).map(c=>`<button class="${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');$('#cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;rCats();rBus()})}
function rBus(){const q=$('#q').value.toLowerCase().trim(),now=new Date(),cm=now.getHours()*60+now.getMinutes();
const L=(busDatabase[cat]||[]).filter(r=>[r.linha,r.itinerario,r.roteiro].join(' ').toLowerCase().includes(q));
if(!L.length){$('#busList').innerHTML='<div class="empty">Nenhum ônibus encontrado.</div>';return}
$('#busList').innerHTML=L.map(r=>{let ni=-1,md=1e9;(r.horarios||[]).forEach((t,i)=>{const m=t.match(/(\d{1,2}):(\d{2})/);if(m){const d=+m[1]*60+ +m[2]-cm;if(d>=0&&d<md){md=d;ni=i}}});
return `<div class="bc"><div class="bh" onclick="this.parentElement.classList.toggle('on')"><div><span class="tag">${r.linha||''}</span><b>${r.itinerario||''}</b></div><span class="ar">▼</span></div><div class="bd"><div><div class="in"><div class="rt"><b>ROTEIRO</b><br>${r.roteiro||''}${r.obs?`<br><br>📌 ${r.obs}`:''}</div><div class="tg">${(r.horarios||[]).map((t,i)=>`<div class="tc ${i===ni?'nx':''}">${i===ni?'<small>PRÓXIMO</small>':''}${t}</div>`).join('')}</div></div></div></div></div>`}).join('')}
function hol(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),q=h+l-7*mm+114,E=new Date(y,Math.floor(q/31)-1,q%31+1),M={};
const ad=(dt,n)=>{M[dt.getMonth()+'-'+dt.getDate()]=n},o=n=>new Date(y,E.getMonth(),E.getDate()+n);
[[0,1,'Confraternização Universal'],[3,21,'Tiradentes'],[4,1,'Dia do Trabalho'],[8,7,'Independência do Brasil'],[9,12,'Nossa Senhora Aparecida'],[10,2,'Finados'],[10,15,'Proclamação da República'],[10,20,'Dia da Consciência Negra'],[11,25,'Natal']].forEach(x=>ad(new Date(y,x[0],x[1]),x[2]));
ad(o(-48),'Carnaval (ponto facultativo)');ad(o(-47),'Carnaval (ponto facultativo)');ad(o(-2),'Sexta-feira Santa');ad(o(0),'Páscoa');ad(o(60),'Corpus Christi (ponto facultativo)');return M}
const modal=h=>{$('#md').innerHTML=`<div class="mb" onclick="event.stopPropagation()">${h}<button class="btn" style="margin-top:18px;width:100%" onclick="cm()">Fechar</button></div>`;$('#md').classList.add('on')},cm=()=>$('#md').classList.remove('on');
function hday(y,m,d){const dt=new Date(y,m,d),s=shift(S.team,dt);modal(`<small style="color:var(--mut)">🎉 Feriado</small><div class="num" style="font-size:1.5rem;margin:8px 0 6px">${hol(y)[m+'-'+d]}</div><div style="color:var(--mut);margin-bottom:10px">${dt.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div><span class="chip" style="background:var(--card2)">Equipe ${S.team}: ${s[1]==='folga'?'Folga':s[0]}</span>`)}
function rRM(){$('#rm').innerHTML=`<div class="row" style="margin-bottom:10px"><h2>Ramais úteis</h2><button class="sm" onclick="rmForm()" aria-label="Adicionar ramal">+</button></div>`+(RM.length?RM.map(r=>`<div class="item" style="animation:none;margin-bottom:8px;background:var(--card2)"><a href="tel:${esc(r.n.replace(/[^\d+*#,;]/g,''))}" style="flex:1;display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0"><span class="ib" style="background:var(--ac);color:var(--on);flex:none">${ic('phone')}</span><div><b>${esc(r.t)}</b><small>${esc(r.n)}</small></div></a><button class="del" onclick="rmForm(${r.id})" aria-label="Editar">${ic('edit')}</button><button class="del" onclick="delRM(${r.id})" aria-label="Excluir">${ic('trash')}</button></div>`).join(''):'<div class="empty" style="padding:14px">Nenhum ramal salvo. Toque em + para adicionar.</div>')}
function rmForm(id){const r=RM.find(x=>x.id===id)||{};modal(`<b style="font-size:1.1rem">${id?'Editar ramal':'Novo ramal'}</b><div class="f" style="margin-top:14px"><input type="text" id="rmt" placeholder="Nome (ex: Portaria 2)" value="${esc(r.t||'')}"><input type="text" id="rmn" inputmode="tel" placeholder="Número do ramal" value="${esc(r.n||'')}"><button class="btn" onclick="saveRM(${id||0})">Salvar</button></div>`)}
function saveRM(id){const t=$('#rmt').value.trim(),n=$('#rmn').value.trim();if(!t||!n.replace(/\D/g,'')){$('#rmn').focus();return}if(id){const r=RM.find(x=>x.id===id);if(r){r.t=t;r.n=n}}else RM.push({id:Date.now(),t,n});sv('app_rm',RM);cm();rRM()}
function delRM(id){modal(`<b>Excluir este ramal?</b><div style="margin-top:14px"><button class="btn" style="background:#ff5d6c;color:#fff;width:100%" onclick="doDelRM(${id})">Excluir</button></div>`)}
function doDelRM(id){RM=RM.filter(r=>r.id!==id);sv('app_rm',RM);cm();rRM()}
let cmn=day0();cmn.setDate(1);
function mon(d){cmn.setMonth(cmn.getMonth()+d);rEsc()}
function setTeam(l){S.team=l;save();rEsc()}
function rEsc(){$('#ltr').innerHTML=['A','B','C','D'].map(l=>`<button class="${l===S.team?'on':''}" onclick="setTeam('${l}')">${l}</button>`).join('');
const y=cmn.getFullYear(),m=cmn.getMonth(),t=day0(),HL=hol(y);$('#mlbl').textContent=MN[m]+' '+y;
let h='';for(let i=0;i<new Date(y,m,1).getDay();i++)h+='<div></div>';
for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const s=shift(S.team,new Date(y,m,d)),hn=HL[m+'-'+d];h+=`<div class="dc ${s[1]} ${+t===+new Date(y,m,d)?'hj':''} ${hn?'hol':''}" ${hn?`onclick="hday(${y},${m},${d})"`:''} style="animation-delay:${d*10}ms">${d}<small>${s[0]}</small></div>`}
$('#cal').innerHTML=h}
function seg(i){document.querySelectorAll('.seg button').forEach((b,j)=>b.classList.toggle('on',j===i));$('#ot').hidden=i!==0;$('#nt').hidden=i!==1}
let om=day0();om.setDate(1);
function omv(d){om.setMonth(om.getMonth()+d);rOT()}
function rOT(){const y=om.getFullYear(),m=om.getMonth(),L=OT.filter(o=>{const d=new Date(o.d+'T00:00');return d.getFullYear()===y&&d.getMonth()===m}).sort((a,b)=>b.d.localeCompare(a.d)),tot=L.reduce((a,o)=>a+o.h,0);
$('#ot').innerHTML=`<div class="card"><div class="row"><button class="sm" onclick="omv(-1)">‹</button><b>${MN[m]} ${y}</b><button class="sm" onclick="omv(1)">›</button></div><div class="num" style="text-align:center;margin:12px 0 0">${fh(tot)}</div><div style="text-align:center;color:var(--mut);font-size:.85rem">total no mês</div></div>
<div class="card f"><input type="date" id="otd" value="${new Date().toLocaleDateString('sv')}"><input type="number" id="oth" step="0.5" min="0" placeholder="Horas (ex: 2,5)" inputmode="decimal"><input type="text" id="otn" placeholder="Observação (opcional)"><button class="btn" onclick="addOT()">Adicionar horas extras</button></div>`+
(L.length?L.map(o=>`<div class="item"><div><b>${fh(o.h)} · ${new Date(o.d+'T00:00').toLocaleDateString('pt-BR')}</b>${o.n?`<small>${esc(o.n)}</small>`:''}</div><button class="del" onclick="delOT(${o.id})" aria-label="Excluir">${ic('trash')}</button></div>`).join(''):'<div class="empty">Nenhum registro neste mês.</div>')}
function addOT(){const h=parseFloat(String($('#oth').value).replace(',','.')),d=$('#otd').value;if(!(h>0)||!d){$('#oth').focus();return}
OT.push({id:Date.now(),d,h,n:$('#otn').value.trim()});sv('app_ot',OT);const dt=new Date(d+'T00:00');om=new Date(dt.getFullYear(),dt.getMonth(),1);rOT()}
function delOT(id){OT=OT.filter(o=>o.id!==id);sv('app_ot',OT);rOT()}
function rNT(){$('#nt').innerHTML=`<div class="card f"><input type="text" id="ntt" placeholder="Título"><textarea id="ntx" placeholder="Escreva sua anotação importante..."></textarea><button class="btn" onclick="addNT()">Salvar anotação</button></div>`+
(NT.length?NT.map(n=>`<div class="item"><div><b>${esc(n.t||'Sem título')}</b><small>${esc(n.x)}</small><small style="font-size:.7rem">${new Date(n.id).toLocaleDateString('pt-BR')}</small></div><button class="del" onclick="delNT(${n.id})" aria-label="Excluir">${ic('trash')}</button></div>`).join(''):'<div class="empty">Nenhuma anotação ainda.</div>')}
function addNT(){const t=$('#ntt').value.trim(),x=$('#ntx').value.trim();if(!t&&!x)return;NT.unshift({id:Date.now(),t,x});sv('app_nt',NT);rNT()}
function delNT(id){NT=NT.filter(n=>n.id!==id);sv('app_nt',NT);rNT()}
function notify(m){if('Notification' in window&&Notification.permission==='granted'){try{new Notification('Meu Turno',{body:m})}catch(e){}}}
async function togN(el){S.notif=el.checked;if(S.notif){if(!('Notification' in window)){alert('Este navegador não suporta notificações.');S.notif=el.checked=false}else{const p=await Notification.requestPermission();if(p!=='granted'){S.notif=el.checked=false;alert('Permissão negada nas configurações do navegador.')}else notify('Notificações ativadas.')}}save();rTop()}
function rCfg(){const sw=(id,on,fn)=>`<label class="sw"><input type="checkbox" ${on?'checked':''} onchange="${fn}"><i></i></label>`;
$('#p-cfg').innerHTML=`<div class="card"><button class="av big-av" id="bigav" onclick="$('#ph').click()">${avH()}</button><label class="up" for="ph">Trocar foto de perfil</label><input type="file" id="ph" accept="image/*" hidden onchange="upPh(this)">
<div class="f"><input type="text" value="${esc(S.name)}" placeholder="Nome do colaborador" oninput="S.name=this.value||'Colaborador';save();rTop()"><input type="text" value="${esc(S.mat)}" placeholder="Número da matrícula" oninput="S.mat=this.value;save()"></div></div>
<div class="card"><div class="set"><div><b>Notificações</b><br><small style="color:var(--mut)">Aviso do turno do dia</small></div>${sw('n',S.notif,'togN(this)')}</div>
<div class="set"><div><b>Tema escuro</b><br><small style="color:var(--mut)">Desligue para o tema claro</small></div>${sw('t',document.documentElement.dataset.theme==='dark',"S.theme=this.checked?'dark':'light';save();applyPrefs()")}</div></div>
<div class="card"><h2 style="margin-bottom:6px">Acessibilidade</h2><div class="set"><b>Tamanho do texto</b><input type="range" min="90" max="135" step="5" value="${S.font}" oninput="S.font=+this.value;save();applyPrefs()"></div>
<div class="set"><b>Alto contraste</b>${sw('c',S.contrast,'S.contrast=this.checked;save();applyPrefs()')}</div>
<div class="set"><b>Reduzir animações</b>${sw('r',S.calm,'S.calm=this.checked;save();applyPrefs()')}</div></div>`}
function upPh(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=240,s=Math.min(im.width,im.height);c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z);S.photo=c.toDataURL('image/jpeg',.82);save();rTop();$('#bigav').innerHTML=avH()};im.src=r.result};r.readAsDataURL(f)}
applyPrefs();rTop();rNav();rHome();rCats();rBus();rCfg();rEsc();rOT();rNT();
$('#q').addEventListener('input',rBus);
const tk=new Date().toLocaleDateString('sv');if(S.notif&&S.ln!==tk){const s=shift(S.team,day0());notify(s[1]==='folga'?'Hoje é dia de folga.':'Hoje: turno '+s[0]);S.ln=tk;save()}
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
